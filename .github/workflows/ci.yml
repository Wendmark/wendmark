name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The portal's service layer is tested against a real Postgres, because
    # the bugs worth catching there are two queries disagreeing with each
    # other — which a mock cannot have an opinion about.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wendmark
          POSTGRES_PASSWORD: wendmark
          POSTGRES_DB: wendmark_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wendmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes dependency boundaries)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test against a real database
        run: pnpm --filter @wendmark/portal test:db
        env:
          DATABASE_URL: postgresql://wendmark:wendmark@localhost:5433/wendmark_test?schema=public
          # Not used by these tests, but lib/env.ts validates the whole
          # environment the first time anything reads it.
          AUTH_SECRET: ci-secret-not-used-for-anything-real-0000

      - name: Snippet size budget (30 KB gzipped)
        run: pnpm size

      - name: Build the browser extension
        run: pnpm --filter @wendmark/extension build
